name: Keep Render bot awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping bot health endpoint
        run: curl --fail --silent --show-error --max-time 20 https://notorious-discord-bot.onrender.com/health?source=github-actions
